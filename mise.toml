[tools]
go = "1.27.4"
terraform = "1.17.2"

[tasks.check]
description = "Check Go formatting, modules, vet, tests, build, and Terraform formatting."
run = [
  'test -z "$(gofmt -l main.go internal)"',
  'go mod verify',
  'go vet ./...',
  'go test ./...',
  'go build -o /dev/null .',
  'terraform fmt -check -recursive examples',
  "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...",
  "go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@v0.25.0 generate --provider-name githubsettings",
  "git diff --exit-code -- docs",
]
